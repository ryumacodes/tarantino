<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Recording controls</title>
  <style>
    html,body { margin:0; background:transparent; color:#fff; font-family:system-ui,sans-serif; }
    main { margin:4px; padding:10px 12px; background:#151515; border:1px solid #444; border-radius:18px; }
    .controls { display:flex; align-items:center; justify-content:space-between; gap:10px; }
    #time { font:600 16px ui-monospace,monospace; font-variant-numeric:tabular-nums; }
    button { border:1px solid #666; border-radius:9px; background:#333; color:white; padding:9px; cursor:pointer; }
    button:disabled { opacity:.5; cursor:wait; }
    #stop { background:#ed3434; border-color:#ed3434; }
    #message { margin:7px 0 0; font-size:11px; color:#ccc; min-height:14px; }
    #message.error { color:#ffb0b0; }
  </style>
</head>
<body>
  <main>
    <div class="controls">
      <span id="time" data-tauri-drag-region aria-label="Recording duration">00:00:00</span>
      <button id="restart" type="button" aria-label="Restart recording">Restart</button>
      <button id="stop" type="button" aria-label="Stop recording">Stop</button>
    </div>
    <p id="message" role="status">Recording</p>
  </main>
  <script type="module" src="/src/recordingHud.ts"></script>
</body>
</html>
