[package]
name = "tarantino"
version = "0.1.0"
authors = ["Tarantino Contributors"]
license = "PolyForm-Noncommercial-1.0.0"
edition = "2024"
rust-version = "1.88"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }
cc = "1.4"

[dependencies]
tauri = { version = "2.11.5", features = [ "tray-icon", "protocol-asset", "macos-private-api", "unstable"] }
tauri-plugin-decorum = "1.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.53", features = ["full"] }
# GPU compositor and rendering
wgpu = "30.0"
bytemuck = { version = "1.25", features = ["derive"] }
pollster = "1.0"
image = "0.25"
base64 = "0.23"
imageproc = "0.27"  # Drawing shapes for cursor rendering
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = "0.3"
parking_lot = "0.12"
dashmap = "6.2"
crossbeam-channel = "0.5"
once_cell = "1.21"
urlencoding = "2.1"
chrono = { version = "0.4", features = ["serde"] }
regex = "1.13"
num_cpus = "1.17"

# Audio processing
cpal = "0.18"

# Mouse tracking - native cursor events
rdev = { git = "https://github.com/fufesou/rdev" }

# Event capture
uuid = { version = "1.24", features = ["v4"] }
lazy_static = "1.5"

# Video processing - Modern native bindings using ffmpeg-next
ffmpeg-next = "8.1"

# Screen capture and encoding
bytes = "1.12"
futures = "0.3"
async-trait = "0.1"

# Video container muxing
mp4 = "0.14"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = "0.25"
objc = "0.2"
objc-foundation = "0.1"
cocoa = "0.26"
# Hardware acceleration and modern capture
metal = "0.33"
dispatch = "0.2"
# ScreenCaptureKit bridge
block = "0.1"
core-media = "0.8"
core-video = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D12", 
    "Win32_Graphics_Dxgi",
    "Win32_System_WinRT",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Media_MediaFoundation",
    # Windows Graphics Capture will be added when implementing the real WGC code
    "Win32_System_Com",
] }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13.13", default-features = false, features = ["screencast", "tokio"] }
libc = "0.2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
