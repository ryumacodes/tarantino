name: Linux

on:
  push:
    branches: [main, linux-support, linux-native-parity, linux-parity-defaults]
  pull_request:

jobs:
  ubuntu:
    name: Ubuntu 24.04
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Test native JavaScript setup
        run: python3 scripts/test-linux-js.py
      - name: Test native Rust setup
        run: python3 scripts/test-linux-rust.py
      - name: Test SteamOS dependency repair
        run: python3 scripts/test-steamos-repair.py
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl file patchelf wget pkg-config libssl-dev xvfb xauth xdotool \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libasound2-dev clang \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libpipewire-0.3-dev \
            libavcodec-dev libavformat-dev libavutil-dev libavfilter-dev \
            libavdevice-dev libswscale-dev libswresample-dev ffmpeg \
            gstreamer1.0-tools gstreamer1.0-pipewire gstreamer1.0-pulseaudio \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-vaapi
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:linux
      - name: Check X11 click zoom without raw input devices
        run: xvfb-run -a env XDG_SESSION_TYPE=x11 cargo test --locked --manifest-path src-tauri/Cargo.toml native_x11_click_without_raw_devices -- --ignored --nocapture
      - name: Check forwarded XTEST clicks without server events
        run: xvfb-run -a env XDG_SESSION_TYPE=x11 cargo test --locked --manifest-path src-tauri/Cargo.toml native_xtest_requests_without_server_events -- --ignored --nocapture
      - name: Build native Linux packages
        run: pnpm build:linux
      - name: Check packaged media runtime without host plugins
        run: |
          package=$(find src-tauri/target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' -print -quit)
          test -n "$package"
          GST_PLUGIN_SYSTEM_PATH_1_0= GST_PLUGIN_PATH_1_0= \
            GST_REGISTRY_1_0="$RUNNER_TEMP/tarantino-gst-registry.bin" \
            APPIMAGE_EXTRACT_AND_RUN=1 "$package" --linux-runtime-check
      - uses: actions/upload-artifact@v4
        with:
          name: tarantino-linux-x86_64
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb

  debian:
    name: Debian Stable
    runs-on: ubuntu-24.04
    container: debian:stable
    steps:
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y \
            build-essential curl file patchelf git wget pkg-config libssl-dev clang \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libasound2-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libpipewire-0.3-dev \
            libavcodec-dev libavformat-dev libavutil-dev libavfilter-dev \
            libavdevice-dev libswscale-dev libswresample-dev ffmpeg \
            gstreamer1.0-tools gstreamer1.0-pipewire gstreamer1.0-pulseaudio \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | \
            sh -s -- -y --default-toolchain 1.88.0 --component rustfmt
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:linux
      - name: Build Linux application
        run: pnpm tauri build --no-bundle

  fedora:
    name: Fedora
    runs-on: ubuntu-24.04
    container: fedora:latest
    steps:
      - name: Install system dependencies
        run: |
          dnf install -y \
            gcc gcc-c++ make curl file patchelf git wget pkgconf-pkg-config \
            openssl-devel clang nodejs npm webkit2gtk4.1-devel \
            libappindicator-gtk3-devel librsvg2-devel libxdo-devel \
            alsa-lib-devel gstreamer1-devel gstreamer1-plugins-base-devel \
            ffmpeg-free ffmpeg-free-devel gstreamer1-plugins-base-tools \
            gstreamer1-plugins-good gstreamer1-plugins-bad-free \
            gstreamer1-plugin-openh264 pipewire-gstreamer pipewire-devel
          npm install --global pnpm@11.17.0
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | \
            sh -s -- -y --default-toolchain 1.88.0 --component rustfmt
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:linux
      - name: Build Linux application
        run: pnpm tauri build --no-bundle

  opensuse:
    name: openSUSE Tumbleweed
    runs-on: ubuntu-24.04
    container: opensuse/tumbleweed:latest
    defaults:
      run:
        shell: /bin/bash -e {0}
    steps:
      - name: Install system dependencies
        run: |
          zypper --non-interactive refresh
          zypper --non-interactive install --no-recommends \
            gcc gcc-c++ make curl file patchelf git wget pkg-config clang \
            libopenssl-devel 'pkgconfig(webkit2gtk-4.1)' \
            libappindicator3-1 librsvg-devel xdotool alsa-devel \
            gstreamer-devel gstreamer-plugins-base-devel gstreamer-utils \
            gstreamer-plugins-base gstreamer-plugins-good \
            gstreamer-plugins-bad gstreamer-plugins-ugly \
            gstreamer-plugin-pipewire 'pkgconfig(libpipewire-0.3)' ffmpeg-7 \
            'pkgconfig(libavcodec)' 'pkgconfig(libavformat)' \
            'pkgconfig(libavutil)' 'pkgconfig(libavfilter)' \
            'pkgconfig(libavdevice)' 'pkgconfig(libswscale)' \
            'pkgconfig(libswresample)'
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore system command paths
        run: echo "/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" >> "$GITHUB_PATH"
      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | \
            sh -s -- -y --default-toolchain 1.88.0 --component rustfmt
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:linux
      - name: Build Linux application
        run: pnpm tauri build --no-bundle

  arch:
    name: Arch Linux
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: Install system dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm \
            git curl wget file patchelf pkgconf openssl clang rustup nodejs pnpm \
            webkit2gtk-4.1 libayatana-appindicator librsvg xdotool alsa-lib \
            ffmpeg gstreamer gst-plugins-base gst-plugins-good \
            gst-plugins-bad gst-plugins-ugly gst-plugin-pipewire
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: |
          rustup default 1.88.0
          rustup component add rustfmt
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:linux
      - name: Build Linux application
        run: pnpm tauri build --no-bundle

  nix:
    name: Nix package environment
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Verify in the Nix development environment
        run: |
          set -o pipefail
          run_nix() {
            local log_file
            log_file=$(mktemp)
            if "$@" 2>&1 | tee "$log_file"; then
              rm -f "$log_file"
              return 0
            fi
            while IFS= read -r line; do
              line=${line//'%'/'%25'}
              echo "::error title=Nix Linux build::$line"
            done < <(tail -n 120 "$log_file")
            rm -f "$log_file"
            return 1
          }
          run_nix nix develop --accept-flake-config --command pnpm install --frozen-lockfile
          run_nix nix develop --accept-flake-config --command pnpm test:linux
          run_nix nix develop --accept-flake-config --command pnpm tauri build --no-bundle

  desktop-portals:
    name: ${{ matrix.name }} ScreenCast portal
    runs-on: ubuntu-24.04
    container: debian:stable
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GNOME
            backend: gnome
            package: xdg-desktop-portal-gnome
          - name: KDE Plasma
            backend: kde
            package: xdg-desktop-portal-kde
          - name: wlroots
            backend: wlr
            package: xdg-desktop-portal-wlr
    steps:
      - name: Install portal and PipeWire runtime
        run: |
          apt-get update
          apt-get install -y \
            dbus xdg-desktop-portal "${{ matrix.package }}" \
            gstreamer1.0-tools gstreamer1.0-pipewire gstreamer1.0-pulseaudio \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad
      - uses: actions/checkout@v4
      - name: Validate ScreenCast portal backend
        run: sh scripts/check-linux-portal-backend.sh "${{ matrix.backend }}"

  packaged-runtime:
    name: AppImage runtime (${{ matrix.distro }})
    needs: ubuntu
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: Ubuntu 24.04
            image: ubuntu:24.04
            install: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends libgtk-3-0 libgl1 libegl1 libopengl0 libgbm1 libasound2t64
          - distro: Fedora
            image: registry.fedoraproject.org/fedora:latest
            install: dnf install -y gtk3 mesa-libGL mesa-libEGL libglvnd-opengl mesa-libgbm alsa-lib
    container: ${{ matrix.image }}
    steps:
      - name: Install desktop runtime baseline
        run: ${{ matrix.install }}
      - uses: actions/download-artifact@v4
        with:
          name: tarantino-linux-x86_64
          path: linux-packages
      - name: Verify packaged media on a different distro
        shell: bash
        run: |
          package=$(find linux-packages -name '*.AppImage' -print -quit)
          test -n "$package"
          chmod +x "$package"
          GST_PLUGIN_SYSTEM_PATH_1_0= GST_PLUGIN_PATH_1_0= \
            GST_REGISTRY_1_0="$RUNNER_TEMP/tarantino-package-registry.bin" \
            APPIMAGE_EXTRACT_AND_RUN=1 "$package" --linux-runtime-check
